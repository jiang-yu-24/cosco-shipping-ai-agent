<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>散运助手 — 中远海运散货 AI Agent</title>
<style>
:root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --text: #1a2b3c;
    --text-secondary: #5a6b7c;
    --primary: #0d5b8a;
    --primary-light: #e3f0f7;
    --accent: #0088cc;
    --border: #dce3e8;
    --user-bubble: #e3f0f7;
    --assistant-bubble: #ffffff;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --card-bg: #f8fafb;
    --code-bg: #f4f6f8;
    --success: #1a8a4a;
    --warning: #c27800;
    --red: #c0392b;
    --radius: 14px;
    --transition: 0.2s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
/* Header */
.header {
    background: linear-gradient(135deg, #0a3d5c 0%, #0d5b8a 50%, #0e6b9e 100%);
    color: #fff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.12);
    z-index: 10;
}
.header .logo { font-size: 28px; }
.header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
.header .subtitle { font-size: 12px; opacity: 0.8; margin-top: 2px; }
/* Sidebar */
.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar {
    width: 260px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
}
.sidebar-section { padding: 18px 16px; border-bottom: 1px solid var(--border); }
.sidebar-section h3 { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.capability-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-radius: 8px; font-size: 13px; cursor: default; transition: var(--transition);
}
.capability-item:hover { background: var(--primary-light); }
.capability-icon { font-size: 18px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--primary-light); }
/* Main chat */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.messages {
    flex: 1; overflow-y: auto; padding: 20px 28px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
}
.welcome-card {
    max-width: 600px; margin: 60px auto; text-align: center;
    background: var(--surface); border-radius: var(--radius); padding: 40px;
    box-shadow: var(--shadow);
}
.welcome-card h2 { font-size: 22px; margin-bottom: 8px; color: var(--primary); }
.welcome-card p { color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; }
.examples { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.example-chip {
    padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); transition: var(--transition);
    white-space: nowrap;
}
.example-chip:hover { background: var(--primary-light); border-color: var(--primary); }
/* Messages */
.msg-row { display: flex; gap: 12px; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg-row.user { flex-direction: row-reverse; }
.msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.msg-row.user .msg-avatar { background: #0d5b8a; color: #fff; }
.msg-row.assistant .msg-avatar { background: #e8f0f8; }
.msg-bubble {
    max-width: 72%; padding: 12px 18px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.msg-row.user .msg-bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
.msg-row.assistant .msg-bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg-actions { display: flex; gap: 6px; margin-top: 6px; }
.msg-actions button {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; font-size: 11px; cursor: pointer; color: var(--text-secondary); transition: var(--transition);
}
.msg-actions button:hover { background: var(--primary-light); border-color: var(--primary); }
.msg-file-dl { margin-top: 8px; }
.msg-file-dl a {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
    background: var(--primary); color: #fff; border-radius: 8px; text-decoration: none; font-size: 12px;
}
/* Email boxes */
.email-box {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
    margin-top: 8px; background: var(--card-bg);
}
.email-box .email-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.email-box .email-content {
    background: var(--code-bg); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.6; position: relative;
}
.email-box .copy-btn {
    position: absolute; top: 8px; right: 8px; font-size: 14px; cursor: pointer;
    padding: 4px 8px; border: none; background: var(--surface); border-radius: 4px; opacity: 0.7;
}
.email-box .copy-btn:hover { opacity: 1; }
/* Loading */
.typing-indicator { display: flex; gap: 4px; padding: 12px 18px; align-items: center; }
.typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); opacity: 0.4; animation: bounce 1.4s infinite; }
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { opacity:0.4; transform:translateY(0); } 40% { opacity:1; transform:translateY(-6px); } }
/* Input area */
.input-area {
    padding: 16px 28px 20px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
}
.input-area textarea {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px;
    font-size: 14px; font-family: inherit; resize: none; outline: none; line-height: 1.6;
    min-height: 48px; max-height: 160px; transition: var(--transition);
}
.input-area textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,91,138,0.1); }
.file-upload-btn {
    width: 44px; height: 44px; border: 1px dashed var(--border); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px;
    transition: var(--transition); flex-shrink: 0; position: relative;
}
.file-upload-btn:hover { border-color: var(--primary); background: var(--primary-light); }
.file-upload-btn input { display: none; }
.file-upload-btn.has-file { border-style: solid; border-color: var(--success); background: #e8f5e9; }
.send-btn {
    width: 48px; height: 48px; border-radius: var(--radius); border: none;
    background: var(--primary); color: #fff; font-size: 22px; cursor: pointer; flex-shrink: 0;
    transition: var(--transition); display: flex; align-items: center; justify-content: center;
}
.send-btn:hover { background: #0a4a70; transform: scale(1.03); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
/* File chip */
.file-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
    background: #e8f5e9; border-radius: 12px; font-size: 12px; color: var(--success);
    margin-bottom: 8px;
}
.file-chip .remove-file { cursor: pointer; font-weight: bold; margin-left: 4px; }
/* Scrollbar */
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: #c0c8d0; border-radius: 3px; }
/* Toast */
.toast {
    position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px;
    font-size: 13px; z-index: 1000; animation: slideIn 0.3s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.toast.success { background: #e8f5e9; color: #1a8a4a; border: 1px solid #a5d6a7; }
.toast.error { background: #fce4ec; color: #c62828; border: 1px solid #ef9a9a; }
@keyframes slideIn { from { opacity:0; transform:translateX(50px); } to { opacity:1; transform:translateX(0); } }
</style>
</head>
<body>

<div class="header">
    <div class="logo">🚢</div>
    <div>
        <h1>散运助手</h1>
        <div class="subtitle">中远海运散货运输 AI 智能助理</div>
    </div>
</div>

<div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-section">
            <h3>服务能力</h3>
            <div class="capability-item"><span class="capability-icon">📄</span>读取文件内容</div>
            <div class="capability-item"><span class="capability-icon">🚢</span>散货船期查询</div>
            <div class="capability-item"><span class="capability-icon">✉️</span>编写邮件</div>
            <div class="capability-item"><span class="capability-icon">📑</span>生成PDF文件</div>
            <div class="capability-item"><span class="capability-icon">📊</span>数据质量控制</div>
            <div class="capability-item"><span class="capability-icon">📋</span>会议纪要生成</div>
        </div>
        <div class="sidebar-section" style="flex:1;">
            <h3>文件暂存区</h3>
            <div id="fileVault" style="font-size:12px;color:var(--text-secondary);">暂无文件</div>
        </div>
        <div class="sidebar-section">
            <button onclick="clearHistory()" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:12px;">🗑️ 清空对话</button>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="messages" id="messages">
            <div class="welcome-card" id="welcomeCard">
                <h2>欢迎使用散运助手</h2>
                <p>请在下方输入指令，或点击示例快速体验</p>
                <div class="examples">
                    <span class="example-chip" onclick="fillInput('查一下西澳-青岛的船期')">查一下西澳-青岛的船期</span>
                    <span class="example-chip" onclick="fillInput('帮我生成几内亚最近五班船期确认函')">生成几内亚船期确认函</span>
                    <span class="example-chip" onclick="fillInput('帮我根据上述确认函内容生成邮件')">根据确认函生成邮件</span>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <label class="file-upload-btn" id="fileBtn" title="上传文件">
                📎 <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.csv,.txt" onchange="handleFile(event)">
            </label>
            <textarea id="userInput" placeholder="输入指令，Enter 发送，Shift+Enter 换行" rows="1" onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()" id="sendBtn">↑</button>
        </div>
    </div>
</div>

<script>
// ===== State =====
let history = [];
let pendingFile = null;
let pendingFileName = '';

// ===== File handling =====
function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        pendingFile = ev.target.result.split(',')[1]; // base64
        pendingFileName = file.name;
        document.getElementById('fileBtn').classList.add('has-file');
        showToast('已加载: ' + file.name, 'success');
    };
    reader.readAsDataURL(file);
}

// ===== Input =====
function fillInput(text) {
    document.getElementById('userInput').value = text;
    document.getElementById('userInput').focus();
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

// ===== Send =====
async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = '48px';
    document.getElementById('welcomeCard')?.remove();

    // User bubble
    addMessage('user', text);

    // File chip
    if (pendingFile) {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `📎 ${pendingFileName} <span class="remove-file" onclick="this.parentElement.remove();pendingFile=null;pendingFileName=''">✕</span>`;
        document.getElementById('messages').appendChild(chip);
    }

    // Typing indicator
    const typingId = addTypingIndicator();
    document.getElementById('sendBtn').disabled = true;

    try {
        const body = { query: text, history: history };
        if (pendingFile) {
            body.file = { name: pendingFileName, data: pendingFile };
            pendingFile = null;
            pendingFileName = '';
            document.getElementById('fileBtn').classList.remove('has-file');
        }

        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await resp.json();

        removeTypingIndicator(typingId);

        if (data.error) {
            addMessage('assistant', '❌ ' + data.error);
        } else {
            // Add to history
            history.push({ role: 'user', content: text });
            history.push({ role: 'assistant', content: data.response });

            // Assistant bubble
            const msgEl = addMessage('assistant', data.response);

            // PDF downloads
            if (data.pdfs && data.pdfs.length > 0) {
                const dl = document.createElement('div');
                dl.className = 'msg-file-dl';
                data.pdfs.forEach(pdf => {
                    const a = document.createElement('a');
                    a.href = 'data:application/pdf;base64,' + pdf.data;
                    a.download = pdf.name;
                    a.textContent = '📥 下载 ' + pdf.name;
                    a.style.marginRight = '8px';
                    dl.appendChild(a);
                    // Add to vault
                    addToVault(pdf.name, pdf.data, 'pdf');
                });
                msgEl.appendChild(dl);
            }

            // Email boxes
            if (data.emails && data.emails.length > 0) {
                data.emails.forEach(email => {
                    const box = createEmailBox(email);
                    msgEl.appendChild(box);
                });
            }
        }
    } catch (err) {
        removeTypingIndicator(typingId);
        addMessage('assistant', '❌ 网络错误: ' + err.message);
    }

    document.getElementById('sendBtn').disabled = false;
    input.focus();
    scrollToBottom();
}

// ===== UI helpers =====
function addMessage(role, text) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    row.innerHTML = `
        <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
        <div>
            <div class="msg-bubble">${escapeHtml(text)}</div>
            <div class="msg-actions">
                <button onclick="copyText(this, '${escapeAttr(text)}')">📋 复制</button>
            </div>
        </div>
    `;
    document.getElementById('messages').appendChild(row);
    scrollToBottom();
    return row.querySelector('.msg-bubble').parentElement;
}

function createEmailBox(email) {
    const div = document.createElement('div');
    div.className = 'email-box';
    let html = '';
    if (email.recipient) html += `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">收件人：${escapeHtml(email.recipient)}</div>`;
    html += `<div class="email-label">主题</div>`;
    html += `<div class="email-content">${escapeHtml(email.subject)}<button class="copy-btn" onclick="copyToClipboard('${escapeAttr(email.subject)}',this)">📋</button></div>`;
    html += `<div class="email-label" style="margin-top:8px;">正文</div>`;
    html += `<div class="email-content">${escapeHtml(email.body).replace(/\n/g,'<br>')}<button class="copy-btn" onclick="copyToClipboard('${escapeAttr(email.body)}',this)">📋</button></div>`;
    div.innerHTML = html;
    return div;
}

function addTypingIndicator() {
    const id = 'typing-' + Date.now();
    const el = document.createElement('div');
    el.id = id;
    el.className = 'msg-row assistant';
    el.innerHTML = '<div class="msg-avatar">🤖</div><div class="typing-indicator"><span></span><span></span><span></span></div>';
    document.getElementById('messages').appendChild(el);
    scrollToBottom();
    return id;
}

function removeTypingIndicator(id) {
    document.getElementById(id)?.remove();
}

function addToVault(name, data, type) {
    const vault = document.getElementById('fileVault');
    if (vault.textContent === '暂无文件') vault.textContent = '';
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;';
    const icon = type === 'pdf' ? '📑' : '📄';
    const a = document.createElement('a');
    a.href = 'data:application/octet-stream;base64,' + data;
    a.download = name;
    a.textContent = icon + ' ' + name;
    a.style.cssText = 'color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    item.appendChild(a);
    vault.appendChild(item);
}

function scrollToBottom() {
    const msgs = document.getElementById('messages');
    setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 50);
}

function clearHistory() {
    history = [];
    document.getElementById('messages').innerHTML = `
        <div class="welcome-card" id="welcomeCard">
            <h2>欢迎使用散运助手</h2>
            <p>请在下方输入指令，或点击示例快速体验</p>
            <div class="examples">
                <span class="example-chip" onclick="fillInput('查一下西澳-青岛的船期')">查一下西澳-青岛的船期</span>
                <span class="example-chip" onclick="fillInput('帮我生成几内亚最近五班船期确认函')">生成几内亚船期确认函</span>
                <span class="example-chip" onclick="fillInput('帮我根据上述确认函内容生成邮件')">根据确认函生成邮件</span>
            </div>
        </div>`;
    document.getElementById('fileVault').textContent = '暂无文件';
}

// ===== Utility =====
function escapeHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
    return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function copyText(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ 已复制';
        setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
    });
}
function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅';
        setTimeout(() => { btn.textContent = '📋'; }, 1500);
    });
}
function showToast(msg, type) {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}
</script>
</body>
</html>
