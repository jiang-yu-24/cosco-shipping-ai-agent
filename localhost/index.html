<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>散运助手 — 中远海运散货 AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-hover: #f8fafb;
    --text: #1e293b;
    --text-muted: #64748b;
    --text-soft: #94a3b8;
    --primary: #0c5d8a;
    --primary-dark: #094a6e;
    --primary-light: #e6f0f7;
    --primary-glow: rgba(12,93,138,0.12);
    --accent: #3b82f6;
    --accent-light: #eff6ff;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
    --user-bubble: linear-gradient(135deg, #e8f0f8, #dfeaf4);
    --assistant-bubble: #ffffff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 2px 12px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.03);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
    --code-bg: #f8fafc;
    --success: #16a34a;
    --success-light: #f0fdf4;
    --warning: #d97706;
    --radius-sm: 10px;
    --radius: 16px;
    --radius-lg: 20px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef1f5;
    background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(12,93,138,0.06) 0%, transparent 100%),
        radial-gradient(ellipse 60% 50% at 85% 40%, rgba(59,130,246,0.04) 0%, transparent 100%);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
    background: linear-gradient(135deg, #0a3f5c 0%, #0d5c8b 40%, #116da0 100%);
    color: #fff;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 24px rgba(10,63,92,0.2);
    z-index: 10;
    position: relative;
    overflow: hidden;
}
.header::after {
    content: ''; position: absolute; bottom:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.3), rgba(255,255,255,0.1));
}
.header .logo {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    border: 1px solid rgba(255,255,255,0.2);
}
.header h1 { font-size: 19px; font-weight: 600; letter-spacing: 0.3px; }
.header .subtitle { font-size: 11px; opacity: 0.75; margin-top: 1px; font-weight: 400; letter-spacing: 0.2px; }

/* Layout */
.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar {
    width: 260px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    box-shadow: 1px 0 8px rgba(0,0,0,0.02);
}
.sidebar-section { padding: 18px 16px; border-bottom: 1px solid var(--border-light); }
.sidebar-section h3 {
    font-size: 11px; color: var(--text-muted); margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600;
}
.capability-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-radius: 10px; font-size: 13px; cursor: default; transition: var(--transition);
    color: var(--text); font-weight: 450;
}
.capability-item:hover { background: var(--primary-light); transform: translateX(2px); }
.capability-icon {
    font-size: 16px; width: 34px; height: 34px; display: flex; align-items: center;
    justify-content: center; border-radius: 10px; background: var(--primary-light);
    transition: var(--transition);
}
.capability-item:hover .capability-icon { transform: scale(1.08); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.messages {
    flex: 1; overflow-y: auto; padding: 24px 32px;
    display: flex; flex-direction: column; gap: 18px;
    scroll-behavior: smooth;
}
.welcome-card {
    max-width: 580px; margin: 80px auto; text-align: center;
    background: var(--surface); border-radius: var(--radius-lg); padding: 48px 40px;
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.04);
    animation: welcomeIn 0.5s ease;
}
@keyframes welcomeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.welcome-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--primary); letter-spacing: -0.3px; }
.welcome-card .welcome-icon { font-size: 48px; margin-bottom: 16px; }
.welcome-card p { color: var(--text-muted); margin-bottom: 24px; line-height: 1.7; font-size: 14px; }
.examples { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.example-chip {
    padding: 10px 18px; border-radius: 24px; font-size: 13px; cursor: pointer;
    border: 1.5px solid var(--border); background: var(--surface);
    transition: var(--transition); color: var(--text-muted); font-weight: 450;
    box-shadow: var(--shadow-sm);
}
.example-chip:hover {
    background: var(--primary-light); border-color: var(--primary);
    color: var(--primary); transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--primary-glow);
}

/* Messages */
.msg-row { display: flex; gap: 12px; animation: msgIn 0.3s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg-row.user { flex-direction: row-reverse; }
.msg-avatar {
    width: 38px; height: 38px; border-radius: 12px; display: flex;
    align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    box-shadow: var(--shadow-sm);
}
.msg-row.user .msg-avatar { background: linear-gradient(135deg, #0d5c8b, #116da0); color: #fff; }
.msg-row.assistant .msg-avatar { background: linear-gradient(135deg, #e8f0f8, #dfe8f2); }
.msg-bubble {
    max-width: 70%; padding: 14px 20px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
    box-shadow: var(--shadow-sm);
}
.msg-row.user .msg-bubble {
    background: var(--user-bubble); border-bottom-right-radius: 6px;
    color: var(--text);
}
.msg-row.assistant .msg-bubble {
    background: var(--assistant-bubble); border-bottom-left-radius: 6px;
    border: 1px solid var(--border); box-shadow: var(--shadow);
}
.msg-actions { display: flex; gap: 6px; margin-top: 8px; }
.msg-actions button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 12px; font-size: 11.5px; cursor: pointer; color: var(--text-muted);
    transition: var(--transition); font-weight: 450;
}
.msg-actions button:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.msg-file-dl { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.msg-file-dl a {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border-radius: 10px; text-decoration: none; font-size: 12.5px;
    font-weight: 500; transition: var(--transition); box-shadow: 0 2px 8px var(--primary-glow);
}
.msg-file-dl a:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--primary-glow); }

/* Email */
.email-box {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
    margin-top: 10px; background: var(--code-bg); box-shadow: var(--shadow-sm);
}
.email-box .email-label {
    font-size: 10px; color: var(--text-soft); margin-bottom: 4px;
    letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600;
}
.email-content {
    background: var(--surface); padding: 12px 16px; border-radius: 10px;
    font-size: 13px; line-height: 1.7; position: relative; border: 1px solid var(--border-light);
    margin-bottom: 8px;
}
.email-content .copy-btn {
    position: absolute; top: 8px; right: 8px; font-size: 14px; cursor: pointer;
    padding: 5px 9px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 6px; opacity: 0.6; transition: var(--transition); color: var(--text-muted);
}
.email-content .copy-btn:hover { opacity: 1; background: var(--primary-light); border-color: var(--primary); }

/* Typing */
.typing-indicator { display: flex; gap: 5px; padding: 16px 20px; align-items: center; }
.typing-indicator span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--primary);
    opacity: 0.35; animation: bounceDots 1.4s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounceDots { 0%,80%,100% { opacity:0.35; transform:translateY(0); } 40% { opacity:1; transform:translateY(-5px); } }

/* Input */
.input-area {
    padding: 16px 28px 22px; background: var(--surface);
    border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.03);
}
.input-area textarea {
    flex: 1; border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 12px 18px; font-size: 14px; font-family: inherit; resize: none;
    outline: none; line-height: 1.65; min-height: 48px; max-height: 160px;
    transition: var(--transition); background: #f9fafb;
}
.input-area textarea:focus {
    border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 4px var(--primary-glow);
}
.file-upload-btn {
    width: 46px; height: 46px; border: 1.5px dashed var(--border); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 20px; transition: var(--transition); flex-shrink: 0;
    background: #f9fafb;
}
.file-upload-btn:hover { border-color: var(--primary); background: var(--primary-light); }
.file-upload-btn input { display: none; }
.file-upload-btn.has-file { border-style: solid; border-color: var(--success); background: var(--success-light); }
.send-btn {
    width: 48px; height: 48px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--primary), #0e6ea4); color: #fff;
    font-size: 22px; cursor: pointer; flex-shrink: 0; transition: var(--transition);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px var(--primary-glow);
}
.send-btn:hover { transform: translateY(-1px) scale(1.02); box-shadow: 0 6px 20px rgba(12,93,138,0.2); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.send-btn:active { transform: scale(0.96); }

/* File chip */
.file-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
    background: var(--success-light); border-radius: 20px; font-size: 12px;
    color: var(--success); font-weight: 500; border: 1px solid #bbf7d0;
    animation: chipIn 0.2s ease;
}
@keyframes chipIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
.file-chip .remove-file { cursor: pointer; font-weight: 600; margin-left: 4px; opacity: 0.6; }
.file-chip .remove-file:hover { opacity: 1; }

/* Vault */
#fileVault a {
    color: var(--text) !important; text-decoration: none; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; font-weight: 450;
}
#fileVault a:hover { color: var(--primary) !important; }

/* Scrollbar */
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: #d4dae0; border-radius: 3px; }
.messages::-webkit-scrollbar-thumb:hover { background: #bcc3ca; }

/* Toast */
.toast {
    position: fixed; top: 24px; right: 24px; padding: 14px 22px; border-radius: 12px;
    font-size: 13px; z-index: 1000; animation: toastIn 0.35s ease;
    box-shadow: var(--shadow-lg); font-weight: 500; letter-spacing: 0.2px;
}
.toast.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
.toast.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
@keyframes toastIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }
</style>
</head>
<body>

<div class="header">
    <div class="logo">🚢</div>
    <div>
        <h1>散运助手</h1>
        <div class="subtitle">中远海运散货运输 · AI 智能助理</div>
    </div>
</div>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-section">
            <h3>服务能力</h3>
            <div class="capability-item"><span class="capability-icon">📄</span>读取文件内容</div>
            <div class="capability-item"><span class="capability-icon">🚢</span>散货船期查询</div>
            <div class="capability-item"><span class="capability-icon">✉️</span>编写邮件</div>
            <div class="capability-item"><span class="capability-icon">📑</span>生成PDF文件</div>
            <div class="capability-item"><span class="capability-icon">📊</span>数据质量控制</div>
            <div class="capability-item"><span class="capability-icon">📋</span>会议纪要生成</div>
        </div>
        <div class="sidebar-section" style="flex:1;">
            <h3>文件暂存区</h3>
            <div id="fileVault" style="font-size:12px;color:var(--text-muted);">暂无文件</div>
        </div>
        <div class="sidebar-section">
            <button onclick="clearHistory()" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--text-muted);transition:var(--transition);font-family:inherit;font-weight:450;">🗑️ 清空对话</button>
        </div>
    </div>

    <div class="main">
        <div class="messages" id="messages">
            <div class="welcome-card" id="welcomeCard">
                <div class="welcome-icon">🌊</div>
                <h2>欢迎使用散运助手</h2>
                <p>您的智能航运助理已就绪。请在下方输入指令，或直接点击示例卡片快速体验。</p>
                <div class="examples">
                    <span class="example-chip" onclick="fillInput('查一下西澳-青岛的船期')">🔍 查一下西澳-青岛的船期</span>
                    <span class="example-chip" onclick="fillInput('帮我生成几内亚最近五班船期确认函')">📑 生成几内亚五班船期确认函</span>
                    <span class="example-chip" onclick="fillInput('帮我根据上述确认函内容生成邮件')">✉️ 根据确认函生成邮件</span>
                </div>
            </div>
        </div>

        <div class="input-area">
            <label class="file-upload-btn" id="fileBtn" title="上传文件">
                📎 <input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.csv,.txt" onchange="handleFile(event)">
            </label>
            <textarea id="userInput" placeholder="输入指令，Enter 发送 · Shift+Enter 换行" rows="1" onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()" id="sendBtn">↑</button>
        </div>
    </div>
</div>

<script>
let history = [];
let pendingFile = null;
let pendingFileName = '';

function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        pendingFile = ev.target.result.split(',')[1];
        pendingFileName = file.name;
        document.getElementById('fileBtn').classList.add('has-file');
        showToast('已加载: ' + file.name, 'success');
    };
    reader.readAsDataURL(file);
}

function fillInput(text) {
    const inp = document.getElementById('userInput');
    inp.value = text;
    inp.focus();
    inp.style.height = 'auto';
    inp.style.height = inp.scrollHeight + 'px';
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = '48px';
    document.getElementById('welcomeCard')?.remove();

    addMessage('user', text);
    if (pendingFile) {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `📎 ${pendingFileName} <span class="remove-file" onclick="this.parentElement.remove();pendingFile=null;pendingFileName='';document.getElementById('fileBtn').classList.remove('has-file')">✕</span>`;
        document.getElementById('messages').appendChild(chip);
    }
    const typingId = addTypingIndicator();
    document.getElementById('sendBtn').disabled = true;

    try {
        const body = { query: text, history: history };
        if (pendingFile) {
            body.file = { name: pendingFileName, data: pendingFile };
            pendingFile = null; pendingFileName = '';
            document.getElementById('fileBtn').classList.remove('has-file');
        }
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await resp.json();
        removeTypingIndicator(typingId);
        if (data.error) {
            addMessage('assistant', '❌ ' + data.error);
        } else {
            history.push({ role: 'user', content: text });
            history.push({ role: 'assistant', content: data.response });
            const msgEl = addMessage('assistant', data.response);

            if (data.pdfs && data.pdfs.length > 0) {
                const dl = document.createElement('div');
                dl.className = 'msg-file-dl';
                data.pdfs.forEach(pdf => {
                    const a = document.createElement('a');
                    a.href = 'data:application/pdf;base64,' + pdf.data;
                    a.download = pdf.name;
                    a.textContent = '📥 ' + pdf.name;
                    dl.appendChild(a);
                    addToVault(pdf.name, pdf.data, 'pdf');
                });
                msgEl.appendChild(dl);
            }
            if (data.emails && data.emails.length > 0) {
                data.emails.forEach(email => { msgEl.appendChild(createEmailBox(email)); });
            }
        }
    } catch (err) {
        removeTypingIndicator(typingId);
        addMessage('assistant', '❌ 网络错误: ' + err.message);
    }
    document.getElementById('sendBtn').disabled = false;
    input.focus();
    scrollToBottom();
}

function addMessage(role, text) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    row.innerHTML = `<div class="msg-avatar">${role==='user'?'👤':'🤖'}</div><div><div class="msg-bubble">${escapeHtml(text)}</div><div class="msg-actions"><button onclick="copyText(this,'${escapeAttr(text)}')">📋 复制</button></div></div>`;
    document.getElementById('messages').appendChild(row);
    scrollToBottom();
    return row.querySelector('.msg-bubble').parentElement;
}

function createEmailBox(email) {
    const div = document.createElement('div');
    div.className = 'email-box';
    let h = email.recipient ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">📬 收件人：${escapeHtml(email.recipient)}</div>` : '';
    h += `<div class="email-label">主题</div><div class="email-content">${escapeHtml(email.subject)}<button class="copy-btn" onclick="copyToClipboard('${escapeAttr(email.subject)}',this)">📋</button></div>`;
    h += `<div class="email-label">正文</div><div class="email-content">${escapeHtml(email.body).replace(/\n/g,'<br>')}<button class="copy-btn" onclick="copyToClipboard('${escapeAttr(email.body)}',this)">📋</button></div>`;
    div.innerHTML = h;
    return div;
}

function addTypingIndicator() {
    const id = 'typing-' + Date.now();
    const el = document.createElement('div');
    el.id = id; el.className = 'msg-row assistant';
    el.innerHTML = '<div class="msg-avatar">🤖</div><div class="typing-indicator"><span></span><span></span><span></span></div>';
    document.getElementById('messages').appendChild(el);
    scrollToBottom();
    return id;
}
function removeTypingIndicator(id) { document.getElementById(id)?.remove(); }

function addToVault(name, data, type) {
    const vault = document.getElementById('fileVault');
    if (vault.textContent === '暂无文件') vault.textContent = '';
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;';
    const a = document.createElement('a');
    a.href = 'data:application/octet-stream;base64,' + data;
    a.download = name; a.textContent = (type==='pdf'?'📑':'📄') + ' ' + name;
    item.appendChild(a); vault.appendChild(item);
}

function scrollToBottom() {
    const msgs = document.getElementById('messages');
    setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 60);
}

function clearHistory() {
    history = [];
    document.getElementById('messages').innerHTML = `<div class="welcome-card" id="welcomeCard"><div class="welcome-icon">🌊</div><h2>欢迎使用散运助手</h2><p>您的智能航运助理已就绪。请在下方输入指令，或直接点击示例卡片快速体验。</p><div class="examples"><span class="example-chip" onclick="fillInput('查一下西澳-青岛的船期')">🔍 查一下西澳-青岛的船期</span><span class="example-chip" onclick="fillInput('帮我生成几内亚最近五班船期确认函')">📑 生成几内亚五班船期确认函</span><span class="example-chip" onclick="fillInput('帮我根据上述确认函内容生成邮件')">✉️ 根据确认函生成邮件</span></div></div>`;
    document.getElementById('fileVault').textContent = '暂无文件';
}

function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function copyText(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ 已复制';
        setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
    });
}
function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅';
        setTimeout(() => { btn.textContent = '📋'; }, 1500);
    });
}
function showToast(msg, type) {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}
</script>
</body>
</html>
